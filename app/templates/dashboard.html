<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careem Genie · Live</title>
<link rel="icon" href="/static/genie_medallion.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ================================================================ TOKENS (Careem green + gold, unchanged) */
:root {
  --black: #020604; --surface: #0b1a13;
  --card: rgba(10, 30, 20, .72); --card2: rgba(18, 44, 30, .78); --stroke: rgba(60, 227, 106, .13);
  --ink: #eefaf2; --ink2: #b9d4c3; --muted: #7f9c8b;
  --careem: #3ce36a; --gold: #e8c26a; --goldline: rgba(232, 194, 106, .35);
  --s1: #27A957; --s2: #4A90E2; --s3: #BD8628; --s4: #D0628C;   /* categorical: green, blue, gold, rose */
  --ok: #3ce36a; --bad: #ff6b5e;
  --r-xl: 30px; --r-lg: 22px; --gap: 20px;
  --bg-blur: 14px;   /* background photo blur (0px = sharp) */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { color: var(--ink); font: 15px/1.4 Inter, system-ui, sans-serif; background: var(--black); overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
.bg-photo, .bg-shade { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
.bg-photo { background: url('/static/genie_night.webp') center 30% / cover no-repeat; filter: blur(var(--bg-blur)) saturate(1.1); transform: scale(1.08); }
.bg-shade { background:
    radial-gradient(900px 520px at 85% 8%, rgba(60, 227, 106, .14), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(232, 194, 106, .08), transparent 60%),
    linear-gradient(180deg, rgba(2, 6, 4, .82) 0%, rgba(2, 10, 6, .9) 45%, rgba(2, 6, 4, .96) 100%); }

/* Designed at 1920x1080; scaled to fit any window (laptop or projector) by fit() below. */
html, body { overflow: hidden; }
.app { width: 1920px; height: 1080px; padding: 22px 34px 22px; display: grid; gap: 18px; align-content: start;
       position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--fit, 1)); transform-origin: center; }
.card { background: var(--card); border: 1px solid var(--stroke); border-radius: var(--r-xl); padding: 22px 26px; backdrop-filter: blur(10px); min-width: 0; }
.ctitle { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 400; margin: 0 0 14px; min-height: 40px; }
.ctitle .sub { margin-left: auto; color: var(--muted); font-size: 13px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--stroke); background: rgba(255,255,255,.03);
         display: grid; place-items: center; text-decoration: none; color: var(--ink); flex: none; }

/* ================================================================ HEADER */
header { display: flex; align-items: center; gap: 22px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.brand .ar { font: 700 20px Amiri, serif; color: var(--gold); }
.medal { width: 46px; height: 46px; border-radius: 50%; background: url('/static/genie_medallion.webp') center/cover; box-shadow: 0 0 0 1px var(--goldline), 0 0 18px rgba(60,227,106,.35); }
nav { margin-left: auto; display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); }
nav a { padding: 11px 24px; border-radius: 999px; color: var(--ink2); text-decoration: none; font-size: 15px; }
nav a.on { background: var(--card2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--stroke); }
.status { display: flex; gap: 10px; }
.status .round { position: relative; cursor: default; color: var(--ink2); }
.status .round svg { width: 20px; height: 20px; display: block; }
.status .round.ok { color: var(--ink); }
.status .round i { position: absolute; right: 0; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); border: 2px solid var(--black); }
.status .round.ok i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.status .round.bad i { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.modesel { height: 44px; border-radius: 999px; border: 1px solid var(--stroke); background: rgba(255,255,255,.04); padding: 0 16px; font-weight: 600; font-size: 13px; letter-spacing: .06em; }
.modesel option { background: var(--surface); }
.clock { font-weight: 300; font-size: 24px; color: var(--ink2); font-variant-numeric: tabular-nums; }

/* ================================================================ HERO */
.hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 30px; padding: 6px 4px 0; }
.hero h2 { margin: 0 0 16px; font-size: 44px; font-weight: 400; letter-spacing: -.02em; }
.hero h2 span { color: var(--careem); }
.rates { display: flex; gap: 14px; align-items: flex-end; }
.rate { display: grid; gap: 10px; }
.rate label { color: var(--ink2); font-size: 15px; padding-left: 6px; white-space: nowrap; }
.rate .bar { height: 44px; border-radius: 999px; display: flex; align-items: center; padding: 0 20px; font-size: 18px; font-weight: 500; min-width: 120px; }
.rate.r1 .bar { background: var(--s1); color: #04140b; }
.rate.r2 .bar { background: #eefaf2; color: #082414; }
.rate.r3 .bar { background: rgba(255,255,255,.08); }
.rate.r4 .bar { background: repeating-linear-gradient(-45deg, rgba(232,194,106,.22) 0 2px, transparent 2px 10px); box-shadow: inset 0 0 0 1px var(--goldline); color: var(--gold); }
.bigs { display: flex; gap: 46px; }
.big { display: grid; justify-items: end; gap: 4px; }
.big .row { display: flex; align-items: center; gap: 14px; }
.big .v { font-size: 66px; font-weight: 300; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big .v small { font-size: 26px; color: var(--ink2); margin-left: 4px; }
.big .l { color: var(--ink2); font-size: 16px; }
.badge { position: relative; width: 60px; height: 60px; border-radius: 50%; background: #eefaf2; color: #082414; display: grid; place-items: center;
         font-size: 15px; font-weight: 600; text-align: center; line-height: 1; letter-spacing: -.02em; }
.badge::before { content: attr(data-arrow); position: absolute; left: -4px; top: -6px; width: 24px; height: 24px; border-radius: 50%;
                 display: grid; place-items: center; font-size: 12px; color: #04140b; background: var(--careem); border: 3px solid var(--black); }
.badge.gold::before { background: var(--gold); }

/* ================================================================ MIDDLE ROW */
.mid { display: grid; grid-template-columns: 380px 1fr 400px; gap: var(--gap); }
.sum { display: grid; gap: 12px; }
.sum .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,.035); border: 1px solid var(--stroke); font-size: 17px; }
.sum .item i { width: 9px; height: 9px; border-radius: 50%; }
.sum .item b { margin-left: auto; font-weight: 500; padding: 5px 13px; border-radius: 999px; background: rgba(255,255,255,.07); font-variant-numeric: tabular-nums; }
.insight { display: flex; gap: 12px; margin-top: 18px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.insight b { color: var(--ink); font-weight: 500; }
.insight .ic { width: 30px; height: 30px; border-radius: 50%; background: rgba(232,194,106,.14); display: grid; place-items: center; flex: none; }
.seg { margin-left: auto; display: flex; gap: 2px; padding: 4px; border-radius: 999px; border: 1px solid var(--stroke); }
.seg button { border: 0; background: none; padding: 8px 18px; border-radius: 999px; color: var(--ink2); cursor: pointer; font-size: 14px; }
.seg button.on { background: var(--card2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--stroke); }
.chartbox { position: relative; height: 228px; }
.legend { display: flex; gap: 18px; color: var(--ink2); font-size: 13px; margin: -8px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }

.hl { background: linear-gradient(160deg, #2fc46a 0%, #1c9a4f 55%, #127a3c 100%); border: 0; color: #04140b; position: relative; overflow: hidden; }
.hl .ctitle { color: #04140b; font-weight: 600; }
.hl .ctitle .round { margin-left: auto; background: rgba(255,255,255,.25); border: 0; color: #04140b; }
.hl p { font-size: 18px; line-height: 1.45; margin: 0; color: #062a15; max-width: 330px; }
.hl p b { font-weight: 700; }
.stack { position: absolute; left: 26px; right: 26px; bottom: 24px; height: 140px; }
.stack .tile { position: absolute; left: 0; right: 0; height: 66px; border-radius: 16px; display: flex; align-items: center; padding: 0 18px; font-size: 17px; color: #082414;
               box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.stack .tile b { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: #04140b; color: #eefaf2; display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.stack .t1 { top: 0; background: #f4fff8; transform: rotate(-3deg); z-index: 2; }
.stack .t2 { top: 72px; background: #d8f5e3; transform: rotate(2deg); }
.stack .tile span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }

/* ================================================================ BOTTOM ROW */
.bot { display: grid; grid-template-columns: 1.55fr 420px 1fr; gap: var(--gap); }
.filters { margin-left: auto; display: flex; gap: 8px; }
.filters select { height: 40px; border-radius: 999px; border: 1px solid var(--stroke); background: rgba(255,255,255,.04); padding: 0 14px; font-size: 14px; }
.filters select option { background: var(--surface); }
.wishes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.wish { border-radius: var(--r-lg); background: rgba(255,255,255,.035); border: 1px solid var(--stroke); padding: 16px; display: flex; flex-direction: column; gap: 10px; height: 232px; animation: rise .5s ease-out; }
.wish.new { box-shadow: 0 0 0 1px var(--careem), 0 0 24px rgba(60,227,106,.25); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.wish .top { display: flex; align-items: flex-start; gap: 8px; }
.tag { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.tag.dm { background: #eefaf2; color: #082414; }
.tag.opened { background: var(--s2); color: #fff; }
.tag.ordered { background: var(--gold); color: #2a1a00; }
.tag.closest { background: rgba(232,194,106,.16); color: var(--gold); box-shadow: inset 0 0 0 1px var(--goldline); }
.tag.none { background: rgba(208,98,140,.18); color: #f3a6c4; }
.tag.wip, .tag.noreply { background: rgba(255,255,255,.08); color: var(--ink2); }
.wish .when { margin-left: auto; text-align: right; color: var(--ink2); font-size: 13px; line-height: 1.35; }
.wish .when .m { display: inline-block; margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 6px; color: #04140b; }
.wish .story { font-size: 14.5px; line-height: 1.4; color: var(--ink); display: grid; gap: 6px; }
.wish .story > div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wish .story .dim { color: var(--ink2); }
.wish .story .dish { color: var(--careem); font-weight: 600; }
.wish .who { margin-top: auto; display: flex; align-items: center; gap: 12px; }
.ava { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #04140b; flex: none; }
.wish .who b { display: block; font-weight: 500; font-size: 15px; }
.wish .who small { color: var(--muted); font-size: 13px; }
.waiting { grid-column: 1 / -1; color: var(--ink2); padding: 40px 0; text-align: center; }

.bubbles { position: relative; height: 232px; }
.bub { position: absolute; border-radius: 50%; display: grid; place-items: center; text-align: center; color: #fff; transition: all .6s; }
.bub b { display: block; font-weight: 400; letter-spacing: -.02em; }
.bub small { display: block; font-size: 13px; opacity: .92; line-height: 1.2; max-width: 120px; margin: 2px auto 0; }
.money { display: flex; gap: 18px; margin: -6px 0 6px; font-size: 13px; color: var(--ink2); }
.money b { color: var(--ink); font-size: 16px; font-weight: 600; }
.money .w b { color: var(--gold); }
.bub.hatch { background: repeating-linear-gradient(-45deg, rgba(255,255,255,.14) 0 2px, transparent 2px 9px) !important; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }

.mind h3 { margin: 0; font-size: 22px; font-weight: 400; display: flex; align-items: center; gap: 10px; }
.mind h4 { margin: 2px 0 12px; font-size: 23px; font-weight: 500; }
.mind .st { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; }
.stream { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ev { border-radius: 16px; border: 1px solid var(--stroke); background: rgba(255,255,255,.035); padding: 10px 12px; font-size: 13px; line-height: 1.35; min-height: 66px; animation: rise .4s ease-out; }
.ev .h { display: flex; gap: 8px; align-items: center; color: var(--ink); font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.ev .h .ic { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: rgba(60,227,106,.14); font-size: 13px; }
.ev .h .t { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ev .x { color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.wishbox { margin-top: 12px; display: flex; align-items: center; gap: 10px; height: 48px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--stroke); padding: 0 8px 0 22px; }
.wishbox input { flex: 1; background: none; border: 0; outline: none; font-size: 15px; }
.wishbox input::placeholder { color: var(--muted); }
.wishbox button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--careem); color: #04140b; cursor: pointer; font-size: 17px; }
.simmsg { color: var(--muted); font-size: 12px; margin: 8px 0 0 22px; min-height: 16px; }
.demo { font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: rgba(255,107,94,.16); color: #ffb3ab; }
</style>
</head>
<body>
<div class="bg-photo"></div><div class="bg-shade"></div>
<div class="app">

  <!-- ============================================================ HEADER -->
  <header>
    <div class="brand"><div class="medal" role="img" aria-label="Careem Genie"></div>Careem Genie <span class="ar">جني كريم</span></div>
    <nav>
      <a class="on" href="#">Overview</a><a href="#wishes">Wishes</a><a href="#insights">Insights</a><a href="#mind">Genie's mind</a><a href="/dashboard/classic">Classic</a>
    </nav>
    <span id="demo"></span>
    <div class="status" id="status"></div>
    <select class="modesel" id="modeSel" title="Agent mode"><option value="live">LIVE</option><option value="cached">CACHED</option><option value="scripted">SCRIPTED</option></select>
    <span class="clock" id="clock">--:--</span>
  </header>

  <!-- ============================================================ HERO -->
  <section class="hero">
    <div>
      <h2>From reels to <span>Careem orders</span></h2>
      <div class="rates" id="rates"></div>
    </div>
    <div class="bigs" id="bigs"></div>
  </section>

  <!-- ============================================================ MIDDLE -->
  <section class="mid" id="insights">
    <div class="card">
      <div class="ctitle">Summary</div>
      <div class="sum" id="sum"></div>
      <div class="insight" id="insight"></div>
    </div>
    <div class="card">
      <div class="ctitle">Wishes over time
        <div class="seg" id="range"><button data-n="0" class="on">Today</button><button data-n="8">Last 2 h</button><button data-n="2">Last 30 min</button></div>
      </div>
      <div class="legend"><span><i style="background:var(--s1)"></i>Wishes</span><span><i style="background:var(--s2)"></i>DMs sent</span><span><i style="background:var(--gold)"></i>Orders</span></div>
      <div class="chartbox"><canvas id="act"></canvas></div>
    </div>
    <div class="card hl">
      <div class="ctitle">Most wanted <a class="round" href="/dashboard/classic" title="Open classic view">↗</a></div>
      <p id="hlText">Waiting for the first wish…</p>
      <div class="stack" id="hlStack"></div>
    </div>
  </section>

  <!-- ============================================================ BOTTOM -->
  <section class="bot">
    <div class="card" id="wishes">
      <div class="ctitle">Live wishes
        <div class="filters">
          <select id="fStage"><option value="all">All</option><option value="dm">DM sent</option><option value="opened">Link opened</option><option value="ordered">Ordered</option><option value="not found">Not on Careem</option></select>
        </div>
      </div>
      <div class="wishes" id="feed"></div>
    </div>
    <div class="card">
      <div class="ctitle">Signals to monetize <span class="sub" id="bubSub"></span></div>
      <div class="money" id="money"></div><div class="bubbles" id="bubbles"></div>
    </div>
    <div class="card mind" id="mind">
      <h3>Hi, I'm Genie 🧞 <span class="st" id="sse">connecting…</span></h3>
      <h4>Here's what I'm doing</h4>
      <div class="stream" id="stream"></div>
      <form class="wishbox" id="sim" autocomplete="off">
        <input name="text" placeholder="Make a wish… try “b kam?” (simulated)">
        <button title="Send a simulated comment">✦</button>
      </form>
      <div class="simmsg" id="simMsg"></div>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S = [css('--s1'), css('--s2'), css('--s3'), css('--s4')];
const MODE_COLOR = { live: S[0], cached: S[1], rules: S[2], scripted: S[3] };
const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('en-US');
const pct = (n) => n == null ? '—' : `${Math.round(n)}%`;
const aed = (n) => n == null ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
const secs = (ms) => ms == null ? '—' : (ms / 1000).toFixed(ms < 10000 ? 1 : 0);
const dubai = (iso, sec) => iso ? new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Asia/Dubai', hour: '2-digit', minute: '2-digit', ...(sec ? { second: '2-digit' } : {}) }) : '';
const ago = (iso) => { const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`; };
const parse = (d) => { if (typeof d !== 'string') return d || {}; try { return JSON.parse(d); } catch { return { text: d }; } };
function fit() { document.documentElement.style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 1080)); }
addEventListener('resize', fit); fit();
setInterval(() => $('clock').textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Dubai', hour: '2-digit', minute: '2-digit' }), 1000);

/* clean a caption into a short human label: drop pasted headings, hashtags, keep first meaningful line */
function shortCaption(c) {
  if (!c) return '';
  const lines = c.split('\n').map(l => l.trim()).filter(l => l && !/^caption\b.*:$/i.test(l) && !/^caption \(/i.test(l) && !l.startsWith('#'));
  const first = (lines[0] || '').replace(/\s+/g, ' ');
  return first.length > 46 ? first.slice(0, 44).trim() + '…' : first;
}
const handle = (r) => '@' + (r.username || r.user || 'someone');
const AVA = [S[0], S[2], S[1], S[3]];
const avaColor = (name) => AVA[[...String(name)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AVA.length];

/* ================================================================ HEADER */
/* one consistent 24x24 line-icon set (stroke = currentColor) */
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONS = {
  instagram: svg('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>'),
  bag: svg('<path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>'),
  spark: svg('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'),
  globe: svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'),
  chat: svg('<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/>'),
};
function renderStatus(h, mode, demoRows) {
  const c = h.components || {};
  const one = (icon, name, key) => { const v = c[key]; const cls = !v ? '' : v.ok ? 'ok' : 'bad';
    return `<span class="round ${cls}" title="${esc(name + ': ' + (v ? v.detail : 'no data yet'))}">${ICONS[icon]}<i></i></span>`; };
  const poll = h.last_poll_s_ago;
  $('status').innerHTML = one('instagram', 'Instagram', 'instagram') + one('bag', 'Careem', 'careem_mcp') + one('spark', 'AI agent (Bedrock)', 'bedrock') + one('globe', 'Tunnel', 'tunnel')
    + `<span class="round ${poll == null ? '' : poll < 15 ? 'ok' : 'bad'}" title="Comment poller: ${poll == null ? 'off' : 'last poll ' + Math.round(poll) + ' s ago'}">${ICONS.chat}<i></i></span>`;
  $('modeSel').value = mode.agent_mode;
  $('demo').innerHTML = demoRows ? `<span class="demo" title="seed_dashboard.py rows — clear before the demo">demo data · ${demoRows}</span>` : '';
}

/* ================================================================ HERO */
function lastVsPrev(arr, n) {   // sum of the last n buckets vs the n before
  const a = arr.slice(-n).reduce((x, y) => x + y, 0), b = arr.slice(-2 * n, -n).reduce((x, y) => x + y, 0);
  return a - b;
}
function renderHero(k, tl) {
  const rate = (cls, label, v) => `<div class="rate ${cls}"><label>${label}</label><div class="bar" style="width:${120 + Math.round((v || 0) * 1.6)}px">${pct(v)}</div></div>`;
  $('rates').innerHTML = rate('r1', 'Want to buy', k.intent_rate) + rate('r2', 'Found on Careem', k.match_rate) + rate('r3', 'Opened the link', k.open_rate) + rate('r4', 'Ordered', k.order_rate);
  const perHour = Math.max(1, Math.round(60 / (tl.step_min || 15)));
  const dOrders = lastVsPrev(tl.orders || [], perHour);
  const big = (v, label, badge, arrow, gold, tip) => `<div class="big" title="${esc(tip)}"><div class="row"><span class="badge${gold ? ' gold' : ''}" data-arrow="${arrow}">${badge}</span><span class="v">${v}</span></div><span class="l">${label}</span></div>`;
  $('bigs').innerHTML =
    big(fmt(k.orders), `Orders · ${dOrders >= 0 ? '+' : ''}${dOrders} in the last hour`, `${dOrders >= 0 ? '+' : ''}${dOrders}`, dOrders >= 0 ? '↗' : '↘', false, 'Orders, and the change vs the hour before') +
    big(`${aed(k.gmv)}<small>AED</small>`, `Order value · avg ${k.aov == null ? '—' : aed(k.aov) + ' AED'}`, k.aov == null ? '—' : aed(k.aov), '◆', true, 'Total and average basket in AED') +
    big(`${secs(k.e2e_p50_ms)}<small>s</small>`, `Reply time · p95 ${k.e2e_p95_ms == null ? '—' : secs(k.e2e_p95_ms) + ' s'}`, k.e2e_p95_ms == null ? '—' : secs(k.e2e_p95_ms), '⚡', false, 'Median reply time; badge = 95th percentile');
}

/* ================================================================ MIDDLE */
function renderSummary(d) {
  const k = d.kpis;
  const item = (color, label, n) => `<div class="item"><i style="background:${color}"></i>${label}<b>${fmt(n)}</b></div>`;
  $('sum').innerHTML = item(S[0], 'Wishes received', k.signals) + item(S[1], 'DMs sent', k.dms) + item(css('--gold'), 'Orders placed', k.orders);
  let text = 'Insights appear as wishes come in.';
  const src = d.by_source || [];
  const reel = src.find(s => /reel/i.test(s.label)), com = src.find(s => /comment/i.test(s.label));
  if (reel && com && (reel.signals + com.signals) >= 4 && ((reel.conversion || 0) + (com.conversion || 0)) > 0) {
    const better = (reel.conversion || 0) >= (com.conversion || 0) ? reel : com, worse = better === reel ? com : reel;
    text = `<b>${better === reel ? 'Reels shared in DM' : 'Comments on posts'}</b> convert at <b>${pct(better.conversion)}</b>, vs ${pct(worse.conversion)} for ${worse === reel ? 'shared reels' : 'comments'}.`;
  } else if ((d.by_restaurant || []).length) {
    const r = d.by_restaurant[0]; text = `<b>${esc(r.label)}</b> is the most asked-for restaurant, with <b>${fmt(r.signals)}</b> wishes.`;
  }
  $('insight').innerHTML = `<span class="ic">✦</span><span>${text}</span>`;
}

let chart, tlCache, rangeN = 0;
function renderActivity(tl) {
  tlCache = tl;
  const n = rangeN || tl.labels.length, cut = (a) => a.slice(-n);
  const labels = cut(tl.labels).map(l => dubai(l));
  const ds = [['Wishes', cut(tl.signals), S[0]], ['DMs sent', cut(tl.dms), S[1]], ['Orders', cut(tl.orders), css('--gold')]].map(([label, data, color]) => ({
    label, data, borderColor: color, backgroundColor: color, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 7,
    pointHoverBorderWidth: 3, pointHoverBorderColor: '#eefaf2', tension: .45, fill: false }));
  if (chart) { chart.data.labels = labels; chart.data.datasets.forEach((d, i) => d.data = ds[i].data); chart.update('none'); return; }
  chart = new Chart($('act'), { type: 'line', data: { labels, datasets: ds }, options: {
    responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false },
      tooltip: { backgroundColor: 'rgba(2,10,6,.95)', borderColor: css('--goldline'), borderWidth: 1, titleColor: css('--gold'), bodyColor: css('--ink'), padding: 12, boxPadding: 4, usePointStyle: true, cornerRadius: 12 } },
    scales: { x: { grid: { color: 'rgba(255,255,255,.04)' }, border: { display: false }, ticks: { color: css('--muted'), maxTicksLimit: 7, font: { size: 12 } } },
      y: { beginAtZero: true, grid: { display: false }, border: { display: false }, ticks: { color: css('--muted'), precision: 0, maxTicksLimit: 5, font: { size: 12 } } } } } });
}
document.querySelectorAll('#range button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#range button').forEach(x => x.classList.toggle('on', x === b));
  rangeN = Number(b.dataset.n); if (chart) { chart.destroy(); chart = null; } if (tlCache) renderActivity(tlCache);
});

function renderHighlight(d) {
  const top = (d.top_dishes || [])[0], second = (d.top_dishes || [])[1];
  const missed = (d.missed || []).reduce((a, m) => a + (m.n || 0), 0);
  if (!top) { $('hlText').textContent = 'Waiting for the first wish…'; $('hlStack').innerHTML = ''; return; }
  $('hlText').innerHTML = `<b>${esc(top.label)}</b> is today's most wanted dish — ${fmt(top.n)} ${top.n === 1 ? 'person' : 'people'} asked Genie for it.`
    + (missed ? ` ${fmt(missed)} ${missed === 1 ? 'wish wasn\'t' : 'wishes weren\'t'} on Careem yet.` : '');
  $('hlStack').innerHTML = `<div class="tile t1"><span>${esc(second ? second.label : top.label)}</span><b>${fmt(second ? second.n : top.n)}</b></div>`
    + `<div class="tile t2"><span>Not on Careem yet</span><b>${fmt(missed)}</b></div>`;
}

/* ================================================================ BOTTOM */
const TAG = { ordered: ['ordered', 'Ordered'], opened: ['opened', 'Link opened'], dm: ['dm', 'DM sent'], matched: ['wip', 'Sending…'],
  'not found': ['none', 'Not on Careem'], 'no intent': ['noreply', 'No reply'], received: ['wip', 'Working…'] };
function story(r) {
  const who = `<b>${esc(handle(r))}</b>`;
  const cap = shortCaption(r.caption);
  const ask = r.kind === 'comment'
    ? `${who} <span class="dim">asked</span> “${esc(r.text)}”${cap ? ` <span class="dim">on</span> ${esc(cap)}` : ''}`
    : `${who} <span class="dim">shared a reel</span>${cap ? `: ${esc(cap)}` : ''}`;
  let ans;
  if (r.stage === 'no intent') ans = `<span class="dim">Not a buying comment, so Genie stayed quiet.</span>`;
  else if (r.status === 'none' || r.stage === 'not found') ans = `<span class="dim">Not on Careem yet — added to missed demand.</span>`;
  else if (r.item) ans = `${r.status === 'closest' ? '<span class="dim">Closest match:</span>' : '<span class="dim">Genie found</span>'} <span class="dish">${esc(r.item)}</span> <span class="dim">at</span> ${esc(r.merchant)}${r.price != null ? ` · AED ${esc(r.price)}` : ''}`;
  else ans = `<span class="dim">Genie is searching Careem…</span>`;
  const after = r.stage === 'ordered' ? ` <span class="dim">→ ordered${r.aed ? ' · AED ' + esc(aed(r.aed)) : ''}.</span>` : r.stage === 'opened' ? ' <span class="dim">→ opened the order link.</span>' : '';
  return `<div>${ask}</div><div>${ans}${after}</div>`;
}
let seenIds = null;
function renderFeed(rows) {
  const f = $('fStage').value;
  const list = rows.filter(r => f === 'all' || r.stage === f).slice(0, 3);
  if (!list.length) { $('feed').innerHTML = `<div class="waiting">${rows.length ? 'No wishes match this filter.' : 'Waiting for the first wish… comment “price?” on a Genie post or share a reel 🪔'}</div>`; return; }
  const fresh = seenIds ? new Set(rows.filter(r => !seenIds.has(r.id)).map(r => r.id)) : new Set();
  seenIds = new Set(rows.map(r => r.id));
  $('feed').innerHTML = list.map(r => {
    const [cls, label] = r.status === 'closest' && r.stage === 'dm' ? ['closest', 'Closest match'] : (TAG[r.stage] || ['wip', r.stage]);
    const name = handle(r).slice(1);
    return `<div class="wish${fresh.has(r.id) ? ' new' : ''}">
      <div class="top"><span class="tag ${cls}">${label}</span>
        <div class="when">${ago(r.received_at)}<br>${r.mode ? `<span class="m" style="background:${MODE_COLOR[r.mode] || S[3]}">${esc(r.mode.toUpperCase())}</span>` : ''}</div></div>
      <div class="story">${story(r)}</div>
      <div class="who"><span class="ava" style="background:${avaColor(name)}">${esc(name[0] || '?').toUpperCase()}</span>
        <div><b>${esc(handle(r))}</b><small>${r.kind === 'comment' ? 'commented on a post' : 'shared a reel in DM'}${r.simulated ? ' · simulated' : ''}</small></div></div>
    </div>`;
  }).join('');
}
$('fStage').onchange = () => data && renderFeed(data.feed || []);

const SIDE = { l: 'left', r: 'right', t: 'top', b: 'bottom' };
/* Signals to monetize: buyers split by how far they got. Ordered = money made; the rest = open opportunities. */
function renderMonetize(d) {
  const k = d.kpis || {}, feed = d.feed || [];
  const ordered = k.orders || 0, opened = Math.max(0, (k.opens || 0) - ordered), dmOnly = Math.max(0, (k.dm_dish || k.dms || 0) - (k.opens || 0));
  const waitingAed = feed.filter(r => (r.stage === 'dm' || r.stage === 'opened') && r.price != null).reduce((a, r) => a + Number(r.price), 0);
  $('bubSub').textContent = `${fmt(k.buying)} buyers`;
  $('money').innerHTML = `<span>Earned <b>${aed(k.gmv)} AED</b></span><span class="w">Waiting <b>~${aed(waitingAed)} AED</b></span>`;
  const rows = [
    { label: 'Ordered', n: ordered, color: css('--gold'), text: '#2a1a00' },
    { label: 'Opened link, not ordered', n: opened, color: S[1] },
    { label: 'Got the DM, not opened', n: dmOnly, color: S[0] },
  ];
  const tot = rows.reduce((a, r) => a + r.n, 0);
  if (!tot) { $('bubbles').innerHTML = '<div class="waiting">No buyers yet</div>'; return; }
  const spots = [{ l: 0, b: 0, max: 190 }, { r: 0, b: 0, max: 160 }, { r: 50, t: 0, max: 130 }];
  // biggest group gets the biggest spot
  const order = rows.map((r, i) => i).sort((a, b) => rows[b].n - rows[a].n);
  $('bubbles').innerHTML = order.map((ri, slot) => {
    const r = rows[ri], s = spots[slot], share = r.n / tot;
    const size = Math.round(Math.min(s.max, Math.max(96, s.max * Math.sqrt(share) * 1.25)));
    const pos = Object.entries(s).filter(([q]) => q !== 'max').map(([q, v]) => `${SIDE[q]}:${v}px`).join(';');
    return `<div class="bub" title="${esc(r.label)}: ${r.n}" style="${pos};width:${size}px;height:${size}px;background:${r.color};color:${r.text || '#fff'};z-index:${3 - slot}">
      <div><b style="font-size:${Math.round(size / 3.6)}px">${fmt(r.n)}</b><small>${esc(r.label)}</small></div></div>`;
  }).join('');
}
function renderBubbles(modes) {
  const rows = (modes || []).slice().sort((a, b) => b.n - a.n).slice(0, 3);
  $('bubSub').textContent = rows.length ? `${fmt(rows.reduce((a, r) => a + r.n, 0))} answers` : '';
  if (!rows.length) { $('bubbles').innerHTML = '<div class="waiting">No answers yet</div>'; return; }
  const spots = rows.length === 1 ? [{ l: 90, t: 6, max: 210 }] : [{ l: 0, b: 0, max: 200 }, { r: 0, b: 0, max: 150 }, { r: 40, t: 0, max: 110 }];
  $('bubbles').innerHTML = rows.map((r, i) => {
    const s = spots[i], size = Math.round(Math.min(s.max, Math.max(92, s.max * Math.sqrt((r.pct || 0) / 100) * (i ? 1.25 : 1))));
    const pos = Object.entries(s).filter(([k]) => k !== 'max').map(([k, v]) => `${SIDE[k]}:${v}px`).join(';');
    return `<div class="bub${i === 2 ? ' hatch' : ''}" style="${pos};width:${size}px;height:${size}px;background:${MODE_COLOR[r.label] || S[3]};z-index:${3 - i}">
      <div><b style="font-size:${Math.round(size / 4)}px">${pct(r.pct)}</b><small>${esc(r.label.toUpperCase())}</small></div></div>`;
  }).join('');
}

/* Genie's mind: newest 4 events as tiles */
const EV = { received: ['📥', 'New wish'], intent: ['🎯', 'Understood'], agent_step: ['🧠', 'Thinking'], tool_call: ['🔧', 'Searching Careem'],
  result: ['✨', 'Answer ready'], reply_public: ['💬', 'Replied publicly'], dm_sent: ['📩', 'DM sent'], confirm_open: ['👆', 'Link opened'],
  order: ['🛒', 'Ordering'], fallback: ['🛟', 'Fallback'], error: ['⚠️', 'Problem'] };
function describe(ev) {
  const d = parse(ev.detail);
  switch (ev.stage) {
    case 'received': return `${d.kind === 'comment' ? 'Comment' : 'Reel'} from @${esc(d.username || d.user)}${d.text ? ': “' + esc(d.text) + '”' : ''}`;
    case 'intent': return d.buying ? `Wants to buy · ${esc(d.reason || d.method || '')}` : `Not buying · ${esc(d.reason || '')}`;
    case 'agent_step': return `Turn ${esc(d.turn)}: ${esc((d.tools || []).join(', ') || d.stop || '')} · ${esc(d.ms)} ms`;
    case 'tool_call': return `${esc(d.tool)} · ${esc(d.ms)} ms${d.error ? ' · failed' : ''}`;
    case 'result': return d.status === 'not_buying' ? 'No reply needed' : `${esc(d.item || d.status)}${d.merchant ? ' at ' + esc(d.merchant) : ''}${d.price_aed != null ? ' · AED ' + esc(d.price_aed) : ''} · ${esc((d.mode || '').toUpperCase())}`;
    case 'reply_public': return 'Posted “Sent you a DM 📩” under the comment';
    case 'dm_sent': return `To @${esc(nameOf(d.to))}${d.total_ms ? ' · ' + (d.total_ms / 1000).toFixed(1) + ' s after the wish' : ''}`;
    case 'confirm_open': return 'Someone opened the Pay in Careem link';
    case 'order': return `${esc(d.step || '')}${d.status ? ' · ' + esc(d.status) : ''}${d.aed ? ' · AED ' + esc(d.aed) : ''}`;
    case 'fallback': return `${d.to ? 'Switched to ' + esc(String(d.to).toUpperCase()) + ' · ' : ''}${esc((d.reason || '').slice(0, 70))}`;
    default: return esc(JSON.stringify(d).slice(0, 90));
  }
}
const nameOf = (id) => ((data?.feed || []).find(r => r.user === String(id)) || {}).username || id;
const mindEvents = [];
function addMind(ev) {
  mindEvents.unshift(ev); mindEvents.length = Math.min(mindEvents.length, 4);
  $('stream').innerHTML = mindEvents.map(e => { const [ic, title] = EV[e.stage] || ['•', e.stage];
    return `<div class="ev"><div class="h"><span class="ic">${ic}</span>${title}<span class="t">${dubai(e.ts, true)}</span></div><div class="x">${describe(e)}</div></div>`; }).join('');
}

/* ================================================================ DATA */
let refreshTimer, busy = false, data;
async function refresh() {
  if (busy) return; busy = true;
  try {
    data = await (await fetch('/api/metrics')).json();
    renderStatus(data.health, data.mode, data.demo_rows); renderHero(data.kpis, data.timeline); renderSummary(data);
    renderActivity(data.timeline); renderHighlight(data); renderFeed(data.feed || []); renderMonetize(data);
  } catch (e) { console.warn('refresh failed', e); } finally { busy = false; }
}
const soon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 500); };
setInterval(refresh, 4000);
function connect() {
  const es = new EventSource('/api/stream');
  es.addEventListener('open', () => $('sse').textContent = '● live');
  es.addEventListener('error', () => $('sse').textContent = '○ reconnecting…');
  es.addEventListener('ev', (m) => { addMind(JSON.parse(m.data)); soon(); });
}
$('modeSel').onchange = async (e) => {
  await fetch('/api/mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: e.target.value }) }); soon();
};
$('sim').onsubmit = async (e) => {
  e.preventDefault();
  const text = e.target.text.value.trim(); if (!text) return;
  const caption = (data?.feed || []).find(r => r.caption)?.caption || 'Crispy chicken shawarma 📍 Operation Falafel';
  const r = await fetch('/simulate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'comment', text, caption, user: 'demo_wish' }) });
  $('simMsg').textContent = r.ok ? 'Wish sent ✓ — watch Live wishes (simulated, not posted to Instagram)' : 'Failed: ' + (await r.text()).slice(0, 80);
  e.target.reset(); setTimeout(() => $('simMsg').textContent = '', 5000);
};
refresh().then(async () => {
  for (const id of (data?.feed || []).slice(0, 2).map(s => s.id).reverse()) {
    try { (await (await fetch('/api/events/' + encodeURIComponent(id))).json()).forEach(addMind); } catch {}
  }
  connect();
});
</script>
</body>
</html>
